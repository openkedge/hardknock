# SPDX-License-Identifier: Apache-2.0

name: Build release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_RUST: "1.98.1"

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install release Rust
        run: >-
          rustup toolchain install "${RELEASE_RUST}"
          --profile minimal --component clippy --component rustfmt
      - name: Match tag and package version
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo +"${RELEASE_RUST}" metadata --locked --no-deps --format-version 1)"
          package_version="$(printf '%s' "${metadata}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          publish="$(printf '%s' "${metadata}" | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["publish"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "${publish}" = "[]"
      - name: Check formatting
        run: cargo +"${RELEASE_RUST}" fmt --all --check
      - name: Run strict Clippy
        run: >-
          cargo +"${RELEASE_RUST}" clippy --locked
          --all-targets --all-features -- -D warnings
      - name: Run the full serial suite
        run: >-
          cargo +"${RELEASE_RUST}" test --locked --all-targets --all-features
          -- --test-threads=1
      - name: Verify package contents
        run: cargo +"${RELEASE_RUST}" package --locked
      - name: Generate release SBOM and license inventory
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/release-metadata"
          mkdir -p "${output_dir}"
          cargo +"${RELEASE_RUST}" metadata --locked --format-version 1 \
            > "${RUNNER_TEMP}/cargo-metadata.json"
          python3 scripts/generate_release_metadata.py \
            --metadata "${RUNNER_TEMP}/cargo-metadata.json" \
            --cargo-lock Cargo.lock \
            --output-dir "${output_dir}"
          mv "${output_dir}/sbom.cdx.json" \
            "${output_dir}/hardknock-${GITHUB_REF_NAME#v}-sbom.cdx.json"
          mv "${output_dir}/third-party-licenses.json" \
            "${output_dir}/hardknock-${GITHUB_REF_NAME#v}-third-party-licenses.json"
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardknock-${{ github.ref_name }}-metadata
          path: ${{ runner.temp }}/release-metadata/*
          if-no-files-found: error
          retention-days: 30
      - name: Attest release metadata provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-metadata/*

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install release Rust
        run: rustup toolchain install "${RELEASE_RUST}" --profile minimal
      - name: Install target
        run: rustup target add --toolchain "${RELEASE_RUST}" "${{ matrix.target }}"
      - name: Set reproducible source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Build product binaries twice
        shell: bash
        run: |
          set -euo pipefail
          for build in a b; do
            CARGO_TARGET_DIR="${RUNNER_TEMP}/build-${build}" \
              cargo +"${RELEASE_RUST}" build --locked --release \
                --target "${{ matrix.target }}" \
                --bin hardknock \
                --bin hk-effect
          done
      - name: Verify reproducible product binaries
        shell: bash
        run: |
          set -euo pipefail
          for binary in hardknock hk-effect; do
            cmp \
              "${RUNNER_TEMP}/build-a/${{ matrix.target }}/release/${binary}" \
              "${RUNNER_TEMP}/build-b/${{ matrix.target }}/release/${binary}"
          done
      - name: Package product binaries and checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive_root="hardknock-${version}-${{ matrix.target }}"
          dist_dir="${RUNNER_TEMP}/dist"
          package_dir="${dist_dir}/${archive_root}"
          mkdir -p "${package_dir}"
          cp "${RUNNER_TEMP}/build-a/${{ matrix.target }}/release/hardknock" "${package_dir}/"
          cp "${RUNNER_TEMP}/build-a/${{ matrix.target }}/release/hk-effect" "${package_dir}/"
          cp LICENSE NOTICE "${package_dir}/"
          test -x "${package_dir}/hardknock"
          test -x "${package_dir}/hk-effect"
          test ! -e "${package_dir}/hardknock-test-adapter"
          "${package_dir}/hardknock" --version
          "${package_dir}/hk-effect" --version
          python3 scripts/package_release.py \
            --source-dir "${package_dir}" \
            --archive "${dist_dir}/${archive_root}.tar.gz" \
            --archive-root "${archive_root}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}"
          cd "${dist_dir}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive_root}.tar.gz" > "${archive_root}.tar.gz.sha256"
          else
            shasum -a 256 "${archive_root}.tar.gz" > "${archive_root}.tar.gz.sha256"
          fi
          echo "archive=${dist_dir}/${archive_root}.tar.gz" >> "${GITHUB_OUTPUT}"
          echo "checksum=${dist_dir}/${archive_root}.tar.gz.sha256" >> "${GITHUB_OUTPUT}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardknock-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

  publish:
    name: Publish GitHub release
    needs:
      - verify
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hardknock-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find dist -maxdepth 1 -type f -print -quit)"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${release_flags[@]}"
