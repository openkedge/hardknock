# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.88.0"
          - "1.98.1"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust ${{ matrix.rust }}
        run: >-
          rustup toolchain install "${{ matrix.rust }}"
          --profile minimal --component clippy --component rustfmt
      - name: Verify Rust toolchain
        run: |
          rustc "+${{ matrix.rust }}" --version --verbose
          cargo "+${{ matrix.rust }}" --version
      - name: Check formatting
        if: matrix.rust == '1.98.1'
        run: cargo "+${{ matrix.rust }}" fmt --all --check
      - name: Verify the minimum supported compiler
        if: matrix.rust == '1.88.0'
        run: >-
          cargo "+${{ matrix.rust }}" check --locked
          --all-targets --all-features
      - name: Run strict Clippy
        if: matrix.rust == '1.98.1'
        run: >-
          cargo "+${{ matrix.rust }}" clippy --locked
          --all-targets --all-features -- -D warnings
      - name: Check documentation
        if: matrix.rust == '1.98.1'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo "+${{ matrix.rust }}" doc --locked --no-deps --all-features

  test:
    name: Test (${{ matrix.os }}, pass ${{ matrix.pass }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
        pass:
          - 1
          - 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify test runtime
        run: |
          rustc +1.98.1 --version --verbose
          python3 --version
          node --version
      - name: Run the full serial suite
        run: >-
          cargo +1.98.1 test --locked --all-targets --all-features
          -- --test-threads=1

  package:
    name: Package and install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Verify package contents
        run: cargo +1.98.1 package --locked
      - name: Smoke-test a normal end-user install
        shell: bash
        run: |
          set -euo pipefail
          install_root="${RUNNER_TEMP}/hardknock-install"
          cargo +1.98.1 install --locked --path . --root "${install_root}"
          test -x "${install_root}/bin/hardknock"
          test -x "${install_root}/bin/hk-effect"
          test ! -e "${install_root}/bin/hardknock-test-adapter"
          set -- "${install_root}/bin/"*
          test "$#" -eq 2
          "${install_root}/bin/hardknock" --version
          "${install_root}/bin/hk-effect" --version

  installer:
    name: Installer (${{ matrix.os }}, ${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: /bin/sh
          - os: ubuntu-24.04
            shell: /bin/dash
          - os: macos-15
            shell: /bin/sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Test installer transactions
        env:
          HARDKNOCK_INSTALL_TEST_SHELL: ${{ matrix.shell }}
        run: scripts/test_install.sh

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check licenses, duplicate dependencies, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.88.0"
          arguments: --all-features
          command: check
          command-arguments: licenses bans sources
      - name: Check RustSec advisories
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test deterministic release metadata generation
        run: python3 scripts/test_release_metadata.py
      - name: Test deterministic release archive generation
        run: python3 scripts/test_package_release.py
      - name: Test fail-closed release evidence verification
        run: python3 scripts/test_release_evidence.py
      - name: Test deterministic production harnesses
        run: |
          set -euo pipefail
          python3 scripts/test_bridge_soak.py
          python3 scripts/test_service_templates.py
          sh scripts/test_integration_conformance.sh
